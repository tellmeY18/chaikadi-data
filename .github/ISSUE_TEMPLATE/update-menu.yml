name: Update a menu
description: Report new prices, new items or removed items for a place already in the library.
title: "Update menu: "
labels: ["update-menu"]
body:
  - type: markdown
    attributes:
      value: |
        Write only what you saw yourself. Do not copy from apps or websites. No personal details, phone numbers or links.
  - type: input
    id: place-id
    attributes:
      label: Place ID
      description: Shown in the app and in the file path, for example in/kl/ernakulam/smart-foodie-kitchen-cyber-green.
      placeholder: in/kl/ernakulam/place-id
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: Changes
      description: |
        One per line. Add or change an item: `name | category | price` (price can be `Half 160, Full 200`, `seasonal`, `market` or `ask`;
        optional columns `veg`, `egg`, `non-veg`, `add-on`, `unavailable`, `2 pcs`, `note: …`). Remove an item: `name | remove`.
        New items go to the section named in a preceding `## Section` line, or to "Other items". Items not listed stay as they are.
      placeholder: |
        Tea | Tea | 18
        Bun Maska | remove
        ## Snacks
        Uzhunnu Vada | Snacks | 15 | veg
    validations:
      required: true
  - type: input
    id: date-seen
    attributes:
      label: Date the prices were seen
      description: YYYY-MM-DD. Not in the future.
      placeholder: "2026-11-12"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: How you saw the prices
      options:
        - In person
        - Printed menu
        - Menu board
        - Bill
  - type: checkboxes
    id: consent
    attributes:
      label: Licence
      options:
        - label: I made this data myself and release it under CC0
          required: true
